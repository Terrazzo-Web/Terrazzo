[server]
host = "localhost"
ports = [3100]
terminal-shell = 'echo "Welcome to Test Environment"; exec /bin/bash -i'
trash = "~/.terrazzo/trash"
git_trash = ".trash"
tantivy_cache = ".tantivy-cache"
search_index_refresh = "1h"
search_index_stale_after = "5m"
pidfile = "~/.terrazzo/terminal-3001.pid"
private_root_ca = "~/.terrazzo/root_ca"
token_lifetime = "5m"
token_refresh = "4m 50s"
config_file_watcher = true
certificate_renewal_threshold = "30days"

