[server]
host = "localhost"
ports = [3201]
trash = "~/.terrazzo/trash"
tantivy_cache = ".tantivy-cache"
search_index_refresh = "1h"
search_index_stale_after = "5m"
pidfile = "~/.terrazzo/terminal-3201.pid"
private_root_ca = "~/.terrazzo/p2p-client-root_ca"
token_lifetime = "5m"
token_refresh = "4m 50s"
config_file_watcher = true
certificate_renewal_threshold = "30days"

[server.config_file_poll_strategy]
fixed = "15s"

[mesh]
client_name = "P2P-Azerty"
gateway_url = "https://localhost"
gateway_pki = "~/.terrazzo/p2p-server-root_ca.cert"
client_certificate = "~/.terrazzo/test_certificate_p2p_azerty"
client_certificate_renewal = "30days"

[mesh.retry_strategy.exponential-backoff]
exponent = 2.0
max_delay = "1m"

[mesh.retry_strategy.exponential-backoff.base]
fixed = "1s"

[mesh.web_rtc]
signaling_url = "http://localhost:3199"
server_name = "terrazzo-terminal-p2p-test"
signaling_timeout = "10s"
handshake_timeout = "30s"
connect_timeout = "45s"

[[mesh.web_rtc.ice_servers]]
urls = ["stun:stun.l.google.com:19302"]
username = ""
credential = ""
